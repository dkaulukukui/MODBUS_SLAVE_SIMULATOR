; PlatformIO Project Configuration File
; PlatformIO Project Configuration File
;
; Multi-Sensor Test Setup
; - Simulator: Runs on one board, simulates all 3 sensors
; - Master: Runs on another board, reads from all 3 sensors
;
; Build/Upload Commands:
;   Simulator: pio run -e simulator -t upload
;   Master:    pio run -e master -t upload
;
; Monitor Commands:
;   Simulator: pio device monitor -e simulator
;   Master:    pio device monitor -e master

[platformio]
default_envs = simulator

; ============================================================================
; SIMULATOR ENVIRONMENT
; Simulates HMP110 (Modbus) + Young x2 (ASCII polling)
; Uses: main.cpp
; ============================================================================
[env:simulator]
platform = atmelsam
board = adafruit_feather_m0_express
framework = arduino

; Source file configuration
build_src_filter = 
    +<main.cpp>
    -<test_master.cpp>
    -<example_multiple_modbus_sensors.cpp>

; Serial Monitor options
monitor_speed = 115200

; Library dependencies (ArduinoModbus for Modbus RTU server)
lib_deps = 
    arduino-libraries/ArduinoModbus@^1.0.9

; Build flags (optional - for debugging)
; build_flags = 
;     -D SIMULATOR_MODE=1

; ============================================================================
; MASTER ENVIRONMENT  
; Reads from simulator (or real sensors)
; Uses: test_master.cpp + custom libraries
; ============================================================================
[env:master]
platform = atmelsam
board = adafruit_feather_m0_express
framework = arduino

; Source file configuration
build_src_filter = 
    +<test_master.cpp>
    -<main.cpp>
    -<example_multiple_modbus_sensors.cpp>

; Include custom libraries from lib/ directory
lib_extra_dirs = 
    lib

; Serial Monitor options
monitor_speed = 115200

; Library dependencies (none needed - using custom libraries)
lib_deps = 

; Build flags (optional - for debugging)
; build_flags = 
;     -D MASTER_MODE=1

; ============================================================================
; REAL SENSORS ENVIRONMENT (Optional - for production deployment)
; Uses: example_multiple_modbus_sensors.cpp
; ============================================================================
[env:real_sensors]
platform = atmelsam
board = adafruit_feather_m0_express
framework = arduino

; Source file configuration
build_src_filter = 
    +<example_multiple_modbus_sensors.cpp>
    -<main.cpp>
    -<test_master.cpp>

; Include custom libraries from lib/ directory
lib_extra_dirs = 
    lib

; Serial Monitor options
monitor_speed = 115200

; Library dependencies
lib_deps = 

; ============================================================================
; COMMON SETTINGS (Optional - can override per environment)
; ============================================================================
; Upload speed
; upload_speed = 921600

; Debug level
; build_flags = 
;     -D DEBUG_LEVEL=1